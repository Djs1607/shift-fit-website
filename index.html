<!DOCTYPE html>
<!--
  ShiftFit — pre-launch landing page (single file, no build needed)
  Upload as index.html. Form is wired to Formspree (f/xqerjrgb) — nothing to change.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="favicon_io/favicon.ico?v=4" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
  <title>ShiftFit · Fitness that fits your shift</title>
  <meta name="description" content="ShiftFit builds your training week around your actual roster: days, nights, 12s, Panama. It adapts to your sleep and fatigue. Join the waiting list." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF9F5;
    --ink: #16170F;
    --ink-soft: #2A2B22;
    --mut: #63655A;
    --line: #E4E2D8;
    --green: #0E5A43;
    --green-deep: #0A4433;
    --paper: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Fraunces', Georgia, serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ── reveal animation (subtle) ── */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } }

  /* ── nav ── */
  nav { border-bottom: 1px solid var(--line); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand img { height: 26px; width: auto; display: block; }
  .brand span { font-weight: 600; font-size: 14px; letter-spacing: .14em; }
  .btn {
    display: inline-block; text-decoration: none; cursor: pointer; border: 0;
    background: var(--ink); color: var(--bg); font-family: 'Inter', sans-serif;
    font-weight: 600; font-size: 15px; padding: 14px 28px; border-radius: 8px;
    transition: background .2s ease;
  }
  .btn:hover { background: var(--green-deep); }
  .btn-sm { padding: 9px 18px; font-size: 14px; }

  /* ── hero ── */
  .hero { padding: 96px 0 88px; }
  .hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 64px; align-items: center; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--green); margin-bottom: 24px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, serif; font-weight: 500;
    font-size: clamp(42px, 5.5vw, 64px); line-height: 1.06; letter-spacing: -0.01em;
    margin-bottom: 24px;
  }
  h1 em { font-style: italic; color: var(--green); }
  .lede { font-size: 18px; color: var(--mut); max-width: 480px; margin-bottom: 36px; }
  .hero-note { font-size: 13.5px; color: var(--mut); margin-top: 16px; }
  .hero-note strong { color: var(--ink); font-weight: 600; }

  /* ── phone mock ── */
  .phone-stage { display: flex; justify-content: center; }
  .phone {
    width: 300px; background: var(--ink); color: #F4F3EC; border-radius: 28px;
    padding: 26px 22px; box-shadow: 0 30px 60px -20px rgba(22,23,15,.35), 0 2px 6px rgba(22,23,15,.1);
    transform: rotate(3deg);
  }
  .phone .p-top { display: flex; justify-content: space-between; font-size: 11.5px; color: #9B9D90; margin-bottom: 18px; }
  .phone .p-label { font-size: 11.5px; color: #9B9D90; margin-bottom: 4px; }
  .phone .p-score { font-family: 'Fraunces', serif; font-size: 44px; font-weight: 500; line-height: 1; }
  .phone .p-score small { font-size: 15px; color: #9B9D90; font-family: 'Inter', sans-serif; }
  .phone .p-bar { height: 4px; background: #33342B; border-radius: 2px; margin: 14px 0 18px; overflow: hidden; }
  .phone .p-bar i { display: block; height: 100%; width: 68%; background: #E8C872; border-radius: 2px; }
  .phone .p-days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 18px; }
  .phone .p-day { border: 1px solid #33342B; border-radius: 8px; text-align: center; padding: 7px 0 5px; font-size: 10px; color: #9B9D90; }
  .phone .p-day b { display: block; font-size: 13px; color: #F4F3EC; font-weight: 600; margin-top: 2px; }
  .phone .p-day.on { background: rgba(200,230,214,.12); border-color: rgba(200,230,214,.4); color: #C8E6D6; }
  .phone .p-day.on b { color: #C8E6D6; }
  .phone .p-wo { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .phone .p-meta { font-size: 11.5px; color: #9B9D90; margin-bottom: 14px; }
  .phone .p-btn { background: #C8E6D6; color: var(--ink); text-align: center; font-size: 13.5px; font-weight: 600; padding: 11px; border-radius: 9px; }

  /* ── stat strip ── */
  .stats { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stats-inner { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat { padding: 30px 24px; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b { display: block; font-family: 'Fraunces', serif; font-weight: 500; font-size: 22px; margin-bottom: 6px; }
  .stat span { font-size: 13.5px; color: var(--mut); }

  /* ── sections ── */
  section { padding: 104px 0; }
  .sec-head { max-width: 560px; margin-bottom: 64px; }
  h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.15; letter-spacing: -0.01em; margin-bottom: 16px; }
  .sec-sub { color: var(--mut); font-size: 17px; }

  /* ── how it works ── */
  .steps { border-top: 1px solid var(--line); }
  .step { display: grid; grid-template-columns: 80px 1fr 1.2fr; gap: 32px; padding: 36px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
  .step .num { font-family: 'Fraunces', serif; font-size: 15px; color: var(--green); }
  .step h3 { font-size: 19px; font-weight: 600; }
  .step p { color: var(--mut); font-size: 15.5px; }

  /* ── pull quote ── */
  .quote-sec { background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
  .pull {
    font-family: 'Fraunces', serif; font-weight: 400; font-style: italic;
    font-size: clamp(26px, 3.4vw, 38px); line-height: 1.3; max-width: 760px; margin: 0 auto 28px;
  }
  .quote-sec .attr { font-size: 14px; color: var(--mut); }

  /* ── features ── */
  .feat-grid { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .feat { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 40px 36px; background: transparent; transition: background .25s ease; }
  .feat:hover { background: var(--paper); }
  .feat .k { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--green); margin-bottom: 14px; }
  .feat h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .feat p { font-size: 15px; color: var(--mut); }

  /* ── waitlist ── */
  .wait-panel { background: var(--ink); color: #F4F3EC; border-radius: 20px; padding: 88px 32px; text-align: center; }
  .wait-panel h2 { color: #F4F3EC; }
  .wait-panel .sec-sub { color: #9B9D90; max-width: 460px; margin: 0 auto 40px; }
  .wait-panel .perks { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; margin-bottom: 40px; }
  .wait-panel .perk { font-size: 13.5px; color: #C8E6D6; display: flex; align-items: center; gap: 8px; }
  .wait-panel .perk::before { content: ""; width: 5px; height: 5px; background: #C8E6D6; border-radius: 50%; }
  form.wl { display: flex; gap: 10px; max-width: 440px; margin: 0 auto; }
  form.wl input {
    flex: 1; min-width: 0; background: #22231B; border: 1px solid #3A3B30; color: #F4F3EC;
    border-radius: 8px; padding: 14px 18px; font-size: 15px; font-family: 'Inter', sans-serif; outline: none;
    transition: border-color .2s ease;
  }
  form.wl input::placeholder { color: #7C7E72; }
  form.wl input:focus { border-color: #C8E6D6; }
  form.wl .btn { background: #C8E6D6; color: var(--ink); white-space: nowrap; }
  form.wl .btn:hover { background: #DCEFE4; }
  form.wl .btn:disabled { opacity: .6; cursor: default; }
  .wl-success { max-width: 440px; margin: 0 auto; border: 1px solid rgba(200,230,214,.35); border-radius: 10px; padding: 18px 24px; }
  .wl-success b { color: #C8E6D6; display: block; font-size: 15.5px; margin-bottom: 4px; }
  .wl-success span { color: #9B9D90; font-size: 14px; }
  .wl-error { color: #E8A09A; font-size: 14px; margin-top: 14px; }
  .fineprint { font-size: 12.5px; color: #7C7E72; margin-top: 22px; }

  /* ── footer ── */
  footer { border-top: 1px solid var(--line); }
  .foot-inner { display: flex; align-items: center; justify-content: space-between; padding: 32px 0; font-size: 13px; color: var(--mut); flex-wrap: wrap; gap: 12px; }
  footer a { color: var(--ink); text-decoration: none; font-weight: 500; }
  footer a:hover { color: var(--green); }

  /* ── responsive ── */
  @media (max-width: 860px) {
    .hero { padding: 64px 0; }
    .hero-grid { grid-template-columns: 1fr; gap: 56px; }
    .step { grid-template-columns: 48px 1fr; }
    .step p { grid-column: 2; }
    .feat-grid { grid-template-columns: 1fr; }
    section { padding: 72px 0; }
    .stats-inner { grid-template-columns: 1fr; }
    .stat + .stat { border-left: 0; border-top: 1px solid var(--line); }
    form.wl { flex-direction: column; }
    .wait-panel { padding: 64px 22px; }
  }
</style>
</head>
